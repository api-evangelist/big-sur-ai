description: >-
  Big Sur AI is an AI-powered SaaS platform for e-commerce merchants, founded in
  2023 by Vinod Ramachandran (CEO) and Arnaud Weber (CTO). Its flagship product is
  an AI Sales Agent that delivers an assisted, conversational shopping experience to
  online shoppers, guiding product discovery and answering questions in real time to
  increase merchant conversion rates and average order sizes. The company raised a
  $6.9M seed round in March 2024 led by Lightspeed Venture Partners, with Guru Chahal
  as the lead partner. This profile was surfaced from the Lightspeed portfolio and
  enriched by the API Evangelist pipeline.
